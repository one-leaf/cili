name: Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows, Python 3.11
            os: windows-latest
            python-version: "3.11"
          - name: Windows, Python 3.12
            os: windows-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Git (for Git Bash tests)
        run: |
          # Git is pre-installed on GitHub-hosted Windows runners
          git --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install chromium

      - name: Run tests
        run: |
          python -m pytest test/ -v --tb=short
        env:
          # config 构造要求存在 API key；CI 无真实密钥，注入占位值
          # （真正调用 LLM 的集成测试已按 integration 标记在服务器不可达时自动跳过；
          #   断言配置文件 key 解析的用例自行 delenv，不受此变量影响）
          ANTHROPIC_API_KEY: "ci-dummy-key-not-real"

  lint:
    name: Code quality
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linters
        # 锁定版本：ruff 规则会随版本漂移，不锁定会让 main 在无关提交上变红
        run: pip install ruff==0.17.0

      - name: Lint with ruff
        run: ruff check core/ web/ interfaces/ main.py
