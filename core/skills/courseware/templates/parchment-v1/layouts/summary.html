<div class="cw-slide">
  <header class="cw-scene-head">
    <span class="cw-kicker">{{SUBJECT}}</span>
    <h2 class="cw-title">{{TITLE}}</h2>
    <p class="cw-subtitle">{{SUBTITLE}}</p>
  </header>
  <div class="cw-scene-body">
    <div class="cw-summary">
      <div class="cw-summary-list">{{BODY}}</div>
      <p class="cw-summary-note">{{SUMMARY_NOTE}}</p>
    </div>
  </div>
  <footer class="cw-scene-foot"><span>{{SOURCE}}</span><span class="cw-page-no">{{PAGE}}</span></footer>
</div>
